name: subathon-timer

services:
  rabbitmq:
    container_name: 'rabbit-mq-prod'
    image: 'rabbitmq:4'
    restart: always
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    environment:
      - 'RABBITMQ_DEFAULT_PASS='
      - 'RABBITMQ_DEFAULT_USER='

  mariadb:
    container_name: 'maria-db-11.4-prod'
    image: 'mariadb:11.4'
    restart: always
    volumes:
      - ~/.docker-conf/mariadb/data/:/var/lib/mysql
      - ./subathon-dataservice/db/:/docker-entrypoint-initdb.d
    environment:
      - 'MARIADB_ROOT_PASSWORD='

  subathon-bot:
    container_name: 'subathonbot'
    image: 'subathonbot:latest'
    restart: always
    environment:
      - 'BOT_TWITCH_USER_ID='
      - 'BOT_TWITCH_OAUTH_CLIENT_ID='
      - 'BOT_TWITCH_OAUTH_CLIENT_SECRET='
      - 'SPRING_RABBITMQ_PASSWORD='
      - 'SPRING_RABBITMQ_USERNAME='
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
    depends_on:
      - rabbitmq

  subathon-dataservice:
    container_name: 'subathondataservice'
    image: 'subathondataservice:latest'
    restart: always
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/subathon'
      - 'SPRING_DATASOURCE_USERNAME=root'
      - 'SPRING_DATASOURCE_PASSWORD='
      - 'SPRING_RABBITMQ_PASSWORD='
      - 'SPRING_RABBITMQ_USERNAME='
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
    depends_on:
      - rabbitmq
      - mariadb
      - subathon-bot

  subathon-ui:
    container_name: 'subathonui'
    image: 'subathonui:latest'
    restart: always
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_RABBITMQ_PASSWORD='
      - 'SPRING_RABBITMQ_USERNAME='
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TWITCH_CLIENT_ID='
      - 'SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TWITCH_CLIENT_SECRET='
    depends_on:
      - subathon-dataservice

